<script>
/* Vista web independiente: SOLO DEMO, sin conexión ni escritura en Google Sheets. */
(function(){
'use strict';
const prefix='mercy_pages_demo_v1';
const initial={
 products:[
 {codigo:'DEMO-001',nombre:'Coca-Cola 600 ml',categoria:'Bebidas',precio:1.50,costo:1.10,existencia:24,minimo:5,activo:true,icono:'🥤'},
 {codigo:'DEMO-002',nombre:'Pepsi 1.5 L',categoria:'Bebidas',precio:1.75,costo:1.30,existencia:14,minimo:5,activo:true,icono:'🥤'},
 {codigo:'DEMO-003',nombre:'Diana Platanitos',categoria:'Snacks',precio:.50,costo:.35,existencia:30,minimo:5,activo:true,icono:'🍌'},
 {codigo:'DEMO-004',nombre:'Galletas chocolate',categoria:'Golosinas',precio:.75,costo:.52,existencia:20,minimo:5,activo:true,icono:'🍪'},
 {codigo:'DEMO-005',nombre:'Sopa instantánea pollo',categoria:'Abarrotes',precio:.85,costo:.60,existencia:4,minimo:5,activo:true,icono:'🍜'}],
 categories:['Bebidas','Snacks','Golosinas','Abarrotes'].map(nombre=>({nombre,descripcion:'',activo:true,icono:'📁'})),
 sales:[],movements:[]
};
let state;try{state=JSON.parse(localStorage.getItem(prefix))||structuredClone(initial)}catch(e){state=JSON.parse(JSON.stringify(initial))}
function save(){try{localStorage.setItem(prefix,JSON.stringify(state))}catch(e){}}
function respond(id,result){setTimeout(()=>window.MercyReceive?.(id,result),0)}
window.MercyAndroid={
 api(id,action,json){let d={};try{d=JSON.parse(json||'{}')}catch(e){}let result={ok:true,data:null};
 try{
 switch(action){
 case 'productos':result.data=state.products;break;
 case 'categorias':result.data=state.categories;break;
 case 'ultimasVentas':result.data=state.sales;break;
 case 'egresosMercaderia':result.data={total:state.movements.reduce((n,m)=>n+m.costo,0),movimientos:state.movements};break;
 case 'guardarProducto':{const index=state.products.findIndex(p=>p.codigo===d.codigo);const p={...state.products[index],...d,existencia:state.products[index]?.existencia||0,activo:true};if(index>=0)state.products[index]=p;else state.products.push(p);save();break}
 case 'guardarCategoria':{const index=state.categories.findIndex(c=>c.nombre===(d.anterior||d.nombre));const c={nombre:d.nombre,descripcion:d.descripcion||'',icono:d.icono||'📁',activo:true};if(index>=0)state.categories[index]=c;else state.categories.push(c);save();break}
 case 'eliminarCategoria':{state.categories=state.categories.filter(c=>c.nombre!==d.nombre);save();break}
 case 'recibirMercaderia':{const p=state.products.find(p=>p.codigo===d.codigo);if(!p)throw Error('Producto no encontrado');p.existencia+=Number(d.cantidad);state.movements.unshift({fecha:new Date().toISOString(),codigo:p.codigo,cantidad:Number(d.cantidad),costo:Number(p.costo||0)*Number(d.cantidad)});save();break}
 case 'registrarVenta':{const items=d.items||d.productos||[];let total=0;for(const item of items){const p=state.products.find(p=>p.codigo===item.codigo);if(!p||Number(p.existencia)<Number(item.cantidad))throw Error('Existencias insuficientes');total+=Number(p.precio)*Number(item.cantidad)}for(const item of items)state.products.find(p=>p.codigo===item.codigo).existencia-=Number(item.cantidad);state.sales.unshift({id:'DEMO-'+Date.now(),fecha:new Date().toISOString(),total,articulos:items.reduce((n,x)=>n+Number(x.cantidad),0),recibido:d.recibido||total});save();result.data={total};break}
 default:throw Error('Acción no disponible en la demostración');
 }
 }catch(e){result={ok:false,error:e.message||'Error de demostración'}}
 respond(id,result);
 },
 photo(){return ''},
 config(){return JSON.stringify({url:'',token:''})},
 saveConfig(){alert('La configuración de Google Sheets no está disponible en el modo demo.')},

function spokenNumber(text){
 const raw=String(text||'').toLowerCase().replace(/,/g,'.').trim();
 const words={'cero':0,'un':1,'uno':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,'trece':13,'catorce':14,'quince':15,'dieciseis':16,'dieciséis':16,'diecisiete':17,'dieciocho':18,'diecinueve':19,'veinte':20,'veintiuno':21,'veintidos':22,'veintidós':22,'veinticinco':25,'treinta':30,'cuarenta':40,'cincuenta':50,'sesenta':60,'setenta':70,'ochenta':80,'noventa':90,'cien':100};

function parseProductSpeech(raw){

 {key:'nombre',re:/\b(?:nombre(?:\s+del\s+producto)?|producto|se\s+llama)\b\s*/gi}
 ];
 const hits=[];for(const tag of tags){for(const m of text.matchAll(tag.re))hits.push({key:tag.key,start:m.index,end:m.index+m[0].length})}

}

}

document.addEventListener('click',async e=>{
let t=e.target.closest('button');if(!t||busy)return;saveFields();

if(t.dataset.period){period=t.dataset.period;render();return}if(t.dataset.inventoryfilter){inventoryFilter=t.dataset.inventoryfilter;inventoryPage=0;render();return}if(t.dataset.historyperiod){historyPeriod=t.dataset.historyperiod;historyPage=0;render();return}

if(t.dataset.editcategory!==undefined){categoryIndex=+t.dataset.editcategory;returnTo='Categorías';draft={};go('Formulario categoría');return}
if(t.dataset.deletecategory!==undefined){let c=categories[+t.dataset.deletecategory];if(!confirm('¿Eliminar '+c.nombre+'?'))return;let r=await api('eliminarCategoria',{nombre:c.nombre});if(r.ok){go('Categorías')}else alertMessage(r.error||'Error al eliminar',true);return}
if(t.dataset.pick!==undefined){draft.categoria=t.dataset.pick;go('Formulario producto');return}
if(t.dataset.add!==undefined||t.dataset.plus!==undefined){let p=t.dataset.add!==undefined?products[+t.dataset.add]:products.find(x=>x.codigo===t.dataset.plus);if(p&&(cart[p.codigo]||0)<Number(p.existencia))cart[p.codigo]=(cart[p.codigo]||0)+1;render();return}
if(t.dataset.minus!==undefined){let code=t.dataset.minus;cart[code]=Math.max(0,(cart[code]||0)-1);if(!cart[code])delete cart[code];render();return}
switch(t.dataset.action){
case 'newProduct':productIndex=-1;draft={};go('Formulario producto');break;
case 'voiceProduct':{
 if(productIndex>=0)break;
 const result=await listenProduct();
 if(!result.ok){alertMessage(result.error||'No se pudo reconocer la voz',true);break}
 const fields=parseProductSpeech(result.text);
 if(fields.nombre)draft.nombre=fields.nombre;
 if(Number.isFinite(fields.precio)&&fields.precio>=0&&!fields.precioAmbiguo)draft.precio=String(fields.precio);
 if(Number.isFinite(fields.costo)&&fields.costo>=0&&!fields.costoAmbiguo)draft.costo=String(fields.costo);
 if(Number.isInteger(fields.minimo)&&fields.minimo>=0)draft.minimo=String(fields.minimo);
 message=(fields.precioAmbiguo?'El precio dictado es ambiguo: ingrésalo manualmente con decimales. ':'')+(fields.costoAmbiguo?'El costo dictado es ambiguo: ingrésalo manualmente con decimales. ':'')+'Escuché: «'+result.text+'». Revisa los datos antes de guardar.';isError=false;render();break;
}
case 'chooseCategory':go('Seleccionar categoría');break;
case 'createInline':categoryIndex=-1;returnTo='Formulario producto';delete draft.catname;delete draft.catdesc;go('Formulario categoría');break;
case 'newCategory':categoryIndex=-1;returnTo='Categorías';draft={};go('Formulario categoría');break;
case 'saveCategory':{if(categoryApiUnavailable){alertMessage('Para guardar categorías debes publicar la versión actualizada de Apps Script.',true);break}
let name=String(draft.catname||'').trim(),desc=String(draft.catdesc||'').trim();if(!name||name.length>80||desc.length>250){alertMessage('Revisa nombre y descripción',true);break}
busy=true;let r=await api('guardarCategoria',{nombre:name,descripcion:desc,icono:draft.caticon||(categoryIndex>=0?categories[categoryIndex].icono:'')||'📁',anterior:categoryIndex<0?'':categories[categoryIndex].nombre});busy=false;
if(!r.ok){alertMessage(r.error||'No se pudo guardar',true);break}
let back=returnTo;if(back==='Formulario producto'){draft.categoria=name;delete draft.catname;delete draft.catdesc;go('Formulario producto')}else{draft={};go('Categorías')}break}
case 'cancelCategory':go(returnTo==='Formulario producto'?'Seleccionar categoría':'Categorías');break;
case 'backProduct':go('Formulario producto');break;
case 'cancelProduct':draft={};go('Productos');break;
case 'saveProduct':{
let p=productIndex>=0?products[productIndex]:null;
let codigo=String(draft.codigo??p?.codigo??'').trim(),nombre=String(draft.nombre??p?.nombre??'').trim(),categoria=draft.categoria??p?.categoria??'';
let precio=Number(draft.precio??p?.precio??0),costo=Number(draft.costo??p?.costo??0),minimo=Number(draft.minimo??p?.minimo??3);
if(!codigo||!nombre||!categoria||!categories.some(c=>c.nombre===categoria)||!Number.isFinite(precio)||precio<0||!Number.isFinite(costo)||costo<0||!Number.isInteger(minimo)||minimo<0){alertMessage('Completa los datos y selecciona una categoría válida',true);break}
busy=true;let r=await api('guardarProducto',{codigo,nombre,categoria,precio,costo,minimo});busy=false;
if(r.ok){if(draft.icono)localStorage.setItem('icon_'+codigo,draft.icono);draft={};go('Productos')}else alertMessage(r.error||'No se pudo guardar',true);break}
case 'prev':page=Math.max(0,page-1);render();break;case 'invPrev':inventoryPage=Math.max(0,inventoryPage-1);render();break;case 'invNext':inventoryPage++;render();break;case 'histPrev':historyPage=Math.max(0,historyPage-1);render();break;case 'histNext':historyPage++;render();break;case 'refreshSales':await refreshSales();break;
case 'next':page++;render();break;
case 'goReceive':go('Mercadería');break;case 'openReceivePicker':receiveSearch='';receivePage=0;go('Seleccionar producto mercadería');break;case 'closeReceivePicker':go('Mercadería');break;case 'receivePrev':receivePage=Math.max(0,receivePage-1);render();break;case 'receiveNext':receivePage++;render();break;case 'reviewReceive':{let p=products.find(x=>x.codigo===receiveCode);alertMessage(p?'Producto: '+p.nombre+' · Existencia: '+p.existencia+' · Entrada: '+receiveQty:'Producto no encontrado',!p);break}case 'scanReceive':{let id=String(++seq);pending[id]=r=>{if(r.ok){receiveCode=r.code;render()}else alertMessage(r.error||'No se pudo escanear',true)};window.MercyAndroid?.scan(id);break}case 'categoryIconPicker':iconTarget='category';iconPickerOpen=true;render();break;case 'iconPicker':iconTarget='product';iconPickerOpen=true;render();break;case 'closeIcon':iconPickerOpen=false;render();break;case 'applyIcon':{let value=$('customIcon')?.value.trim();if(value)draft[iconTarget==='category'?'caticon':'icono']=value;iconPickerOpen=false;render();break}case 'pickPhoto':{let code=String(draft.codigo||'').trim();if(!code){alertMessage('Ingresa primero el código del producto',true);break}window.MercyAndroid?.pickPhoto(code);break}
case 'openCategories':go('Categorías');break;
case 'scan':case 'scanSale':{
let id=String(++seq);pending[id]=r=>{if(r.ok){if(t.dataset.action==='scan'){draft.codigo=r.code;render()}else{let p=products.find(x=>x.codigo===r.code);if(p&&Number(p.existencia)>0){cart[p.codigo]=Math.min(Number(p.existencia),Number(cart[p.codigo]||0)+1);saleQuery='';render()}else{saleQuery=r.code;render();alertMessage('Producto no disponible o sin existencias',true)}}}else alertMessage(r.error||'No se pudo escanear',true)};window.MercyAndroid?.scan(id);break}
case 'receive':{
let codigo=receiveCode,qty=Number($('receiveQty').value);if(!products.some(p=>p.codigo===codigo)){alertMessage('Selecciona un producto válido',true);break}if(!Number.isInteger(qty)||qty<=0){alertMessage('Cantidad inválida',true);break}
busy=true;let r=await api('recibirMercaderia',{codigo,cantidad:qty});busy=false;
if(r.ok){movements.unshift({name:products.find(p=>p.codigo===codigo)?.nombre||codigo,qty});go('Mercadería')}else alertMessage(r.error||'No se pudo registrar entrada',true);break}
case 'posPrev':posPage=Math.max(0,posPage-1);render();break;case 'posNext':posPage++;render();break;case 'openPosCart':posCheckout=true;render();break;case 'closePosCart':posCheckout=false;render();break;case 'clearCart':{cartClearDialog=true;render();break}case 'cancelClearCart':{cartClearDialog=false;render();break}case 'confirmClearCart':{cartClearDialog=false;cart={};received='';posCheckout=false;render();break}case 'completeSale':{
let entries=Object.entries(cart),total=entries.reduce((s,[code,q])=>s+Number(products.find(p=>p.codigo===code)?.precio||0)*q,0);
if(!entries.length){alertMessage('Agrega productos',true);break}
if(payment==='Efectivo'&&Number(received)<total){alertMessage('El efectivo recibido es insuficiente',true);break}
let items=entries.map(([codigo,cantidad])=>({codigo,cantidad}));busy=true;
let r=await api('registrarVenta',{items,productos:items,metodoPago:payment,recibido:Number(received||0)});busy=false;
if(r.ok){posSuccess={total,recibido:Number(received||0),cambio:payment==='Efectivo'?Math.max(0,Number(received||0)-total):0,payment,count:entries.reduce((n,[,q])=>n+q,0)};cart={};received='';posCheckout=false;render();refreshProducts()}else alertMessage(r.error||'No se pudo registrar la venta',true);break}case 'posDone':posSuccess=null;posCheckout=false;render();break;case 'posNewSale':posSuccess=null;posCheckout=false;saleQuery='';posCategory='Todas';posPage=0;render();break;
case 'applyReportDates':{let from=$('reportFrom')?.value||'',to=$('reportTo')?.value||'';if(from&&to&&from>to){alertMessage('La fecha inicial no puede ser posterior a la final',true);break}reportFrom=from;reportTo=to;render();break}
case 'saveAppearance':{
 let storeName=$('appearanceStoreName')?.value.trim(),storeIcon=$('appearanceStoreIcon')?.value.trim();
 if(!storeName||!storeIcon){alertMessage('Indica nombre e icono principal',true);break}
 let menus={};for(let k of Object.keys(menuDefaults)){let label=document.querySelector('[data-appearance-label="'+k+'"]')?.value.trim();let icon=document.querySelector('[data-appearance-icon="'+k+'"]')?.value.trim();menus[k]={label:label||menuDefaults[k].label,icon:icon||menuDefaults[k].icon}}
 appearance={storeName,storeIcon,primary:$('appearancePrimary').value,secondary:$('appearanceSecondary').value,background:$('appearanceBackground').value,fontScale:appearance.fontScale,menus};
 localStorage.setItem('mercy_appearance_v1',JSON.stringify(appearance));applyAppearance();render();alertMessage('Personalización guardada');break}
case 'resetAppearance':{if(!confirm('¿Restaurar los colores, nombres e iconos originales?'))break;appearance=JSON.parse(JSON.stringify(appearanceDefaults));localStorage.removeItem('mercy_appearance_v1');applyAppearance();render();alertMessage('Apariencia restaurada');break}
case 'saveConfig':{
window.MercyAndroid?.saveConfig($('url').value,$('token').value);alertMessage('Configuración enviada al dispositivo');break}
case 'testConfig':{let r=await api('productos');alertMessage(r.ok?'Conexión correcta':r.error||'Error de conexión',!r.ok);break}
}
});
