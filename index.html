function spokenNumber(text){
 const raw=String(text||'').toLowerCase().replace(/,/g,'.').trim();
 const words={'cero':0,'un':1,'uno':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,'trece':13,'catorce':14,'quince':15,'dieciseis':16,'dieciséis':16,'diecisiete':17,'dieciocho':18,'diecinueve':19,'veinte':20,'veintiuno':21,'veintidos':22,'veintidós':22,'veinticinco':25,'treinta':30,'cuarenta':40,'cincuenta':50,'sesenta':60,'setenta':70,'ochenta':80,'noventa':90,'cien':100};

 const value=v=>{v=normalize(v);if(/^\d+(?:\.\d+)?$/.test(v))return Number(v);const parts=v.split(/\s+(?:y)\s+/);const toks=parts.flatMap(x=>x.split(/\s+/));if(!toks.length||toks.some(w=>words[w]===undefined))return NaN;return toks.reduce((n,w)=>n+words[w],0)};

 if(pieces.length===2){let whole=value(pieces[0]),fraction=value(pieces[1]);if(Number.isFinite(whole)&&Number.isFinite(fraction)&&fraction>=0&&fraction<100)return whole+fraction/100}
 return value(raw);
}
function parseProductSpeech(raw){

 {key:'precio',re:/\b(?:precio(?:\s+de\s+venta)?|valor|cuesta|vale)\b\s*(?!de\s+compra)(?:de|es|a)?\s*/gi},
 {key:'minimo',re:/\b(?:cantidad\s+m[ií]nima|stock\s+m[ií]nimo|m[ií]nimo|alerta\s+de\s+stock)\b\s*(?:de|es|a)?\s*/gi},
 {key:'nombre',re:/\b(?:nombre(?:\s+del\s+producto)?|producto|se\s+llama)\b\s*/gi}
 ];
 const hits=[];for(const tag of tags){for(const m of text.matchAll(tag.re))hits.push({key:tag.key,start:m.index,end:m.index+m[0].length})}
 hits.sort((a,b)=>a.start-b.start||b.end-a.end);
 const filtered=[];for(const h of hits){if(filtered.some(v=>h.start<v.end))continue;filtered.push(h)}

 if(!filtered.some(x=>x.key==='nombre')){parts.nombre=text.slice(0,filtered.length?filtered[0].start:text.length).replace(/^(?:agregar|registrar|nuevo|nueva)\s+/i,'').trim()}

}
