function mercyUsbAddCode(){

 if(!code)return;
 if(input)input.value='';
 const item=products.find(p=>String(p.codigo||'').trim()===code);
 if(!item){
  productIndex=-1;draft={codigo:code,stockInicial:''};cartProductReturn=true;cartNewQty=1;
  posCheckout=false;go('Formulario producto');
  alertMessage('Código '+code+' no registrado. Crea el producto y vuelve a la venta; el carrito se conserva.');
  return;
 }
 const current=Number(cart[item.codigo]||0),stock=Number(item.existencia||0);
 if(stock<=current){alertMessage('Sin existencias disponibles para '+item.nombre,true);return}
 cart[item.codigo]=current+1;

// Lector de pistola global (modo teclado): funciona desde cualquier pantalla de PC.
// Detecta rafagas rapidas terminadas en Enter; no interpreta escritura humana normal.
let mercyGunBuffer='',mercyGunFirst=0,mercyGunLast=0,mercyGunTarget=null;
function mercyGunProcess(code){
 code=String(code||'').trim();if(!code)return;
 const product=products.find(p=>String(p.codigo||'').trim()===code);
 // Productos e Inventario: buscar en la pantalla actual, sin iniciar venta.
 if(screen==='Productos'||screen==='Inventario'){
  if(product){
   if(screen==='Productos'){query=code;filter='Todas';page=0}
   else{inventoryQuery=code;inventoryFilter='Todos';inventoryPage=0}
   render();
   alertMessage('Producto encontrado: '+product.nombre);
  }else{
   productIndex=-1;draft={codigo:code,stockInicial:''};
   cartProductReturn=false;
   go('Formulario producto');
   alertMessage('Código '+code+' no encontrado. Registra un producto nuevo.');
  }
  return;
 }
 // En otras pantallas se mantiene la venta rápida por pistola.
 if(screen!=='Vender')go('Vender');
 posCheckout=false;posSuccess=null;
 if(product){
  const current=Number(cart[product.codigo]||0);
  if(Number(product.existencia||0)<=current){alertMessage('Sin existencias disponibles para '+product.nombre,true);return}
  cart[product.codigo]=current+1;
  saleRequestId='';fiadoRequestId='';
  render();
  alertMessage('Producto agregado a la venta: '+product.nombre);
 }else{
  productIndex=-1;draft={codigo:code,stockInicial:''};
  cartProductReturn=true;cartNewQty=1;
  go('Formulario producto');
  alertMessage('Código '+code+' no registrado. Registra el producto; la venta actual se conserva.');
 }
}
document.addEventListener('keydown',e=>{
 if(!window.matchMedia('(min-width:768px)').matches||e.ctrlKey||e.altKey||e.metaKey||e.isComposing)return;
 if(document.getElementById('mercyDesktopScanner')||document.getElementById('mercyInlineScan'))return;
 const now=performance.now();
 if(e.key==='Enter'){
  const code=mercyGunBuffer;
  const elapsed=now-mercyGunFirst;
  const target=mercyGunTarget;
  mercyGunBuffer='';mercyGunFirst=0;mercyGunLast=0;mercyGunTarget=null;
  // >= 6 caracteres y velocidad propia de lector de barras.
  if(code.length>=6&&elapsed<=Math.max(400,code.length*75)&&elapsed/code.length<75){
   e.preventDefault();e.stopImmediatePropagation();
   // El lector puede escribir en un input que tenga el foco; retiramos solo el sufijo escaneado.
   if(target&&('value' in target)&&target.isConnected&&typeof target.value==='string'&&target.value.endsWith(code)){
    target.value=target.value.slice(0,-code.length);
    target.dispatchEvent(new Event('input',{bubbles:true}));
   }
   mercyGunProcess(code);
  }
  return;
 }
 if(e.key.length!==1||!/[a-zA-Z0-9]/.test(e.key)){mercyGunBuffer='';mercyGunLast=0;return}
 if(!mercyGunLast||now-mercyGunLast>95){mercyGunBuffer='';mercyGunFirst=now;mercyGunTarget=e.target}
 mercyGunBuffer+=e.key;mercyGunLast=now;
},true);

</script><script id="mercy-keyboard-viewport-v1">
(function(){
 const root=document.documentElement;
 let baseline=Math.max(window.innerHeight,document.documentElement.clientHeight);
 let lastFocused=null;
 function sync(){
  const v=window.visualViewport;
  const height=v?Math.round(v.height):window.innerHeight;
  const offset=v?Math.round(v.offsetTop):0;
  const visible=Math.max(180,height);
  const keyboard=baseline-visible>130&&!!document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  root.style.setProperty('--mercy-visible-height',visible+'px');
  root.style.setProperty('--mercy-keyboard-inset',Math.max(0,baseline-visible)+'px');
  const overlay=document.getElementById('mercyOverlay');
  if(overlay&&!overlay.hidden){overlay.style.top=offset+'px';}
  document.body.classList.toggle('mercy-keyboard-open',keyboard);
 }
 function ensureVisible(){
  const el=document.activeElement;
  if(!el||!el.matches||!el.matches('input,textarea,select,[contenteditable=true]'))return;
  const viewport=window.visualViewport;
  const height=viewport?viewport.height:window.innerHeight;
  const top=viewport?viewport.offsetTop:0;
  const rect=el.getBoundingClientRect();
  if(rect.bottom>top+height-18||rect.top<top+10)el.scrollIntoView({block:'center',behavior:'instant'});
 }
 if(window.visualViewport){window.visualViewport.addEventListener('resize',()=>{sync();ensureVisible()});window.visualViewport.addEventListener('scroll',sync)}
 window.addEventListener('resize',sync);
 document.addEventListener('focusin',e=>{if(e.target.matches?.('input,textarea,select,[contenteditable=true]')){lastFocused=e.target;requestAnimationFrame(sync)}});
 document.addEventListener('focusout',()=>requestAnimationFrame(sync));
 document.addEventListener('DOMContentLoaded',sync);
 sync();
})();
</script></body></html>
